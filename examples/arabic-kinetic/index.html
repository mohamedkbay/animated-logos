<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arabic kinetic type · animated logos</title><style>@font-face{font-family:MotionArabic;src:url('./font.woff2');font-weight:700}*{box-sizing:border-box}body{margin:0;background:#242827;color:#f0eee5;font:14px MotionArabic,sans-serif;display:grid;justify-items:center;padding:20px;gap:12px}canvas{max-width:min(100%,440px);height:auto;box-shadow:0 12px 60px #0004}nav{display:flex;gap:12px;align-items:center;width:min(440px,100%)}button{font:inherit;padding:8px 18px;cursor:pointer;color:#f0eee5;background:#3c4440;border:1px solid #68756d;border-radius:6px}input{flex:1;min-width:80px}output{font:12px monospace}</style><canvas id="stage" width="540" height="960" aria-label="Original Arabic typography and shape motion study"></canvas><nav><button id="play">تشغيل</button><input id="seek" aria-label="وقت المعاينة" type="range" min="0" max="18" step=".01" value="0"><output id="time">0.00s</output></nav><script src="plan.js"></script><script src="engine.js"></script><script>
let renderer,playing=false,clock=0,started=0;const stage=document.getElementById('stage'),seek=document.getElementById('seek'),button=document.getElementById('play');
window.motionReady=(async()=>{await document.fonts.load('700 110px MotionArabic');await document.fonts.ready;renderer=KineticType.createRenderer(stage,window.KINETIC_PLAN);window.renderAt=t=>{clock=t;const state=renderer.draw(t);seek.value=t;document.getElementById('time').value=t.toFixed(2)+'s';return state};window.motionRenderer=renderer;return renderAt(0)})();
function tick(now){if(!playing)return;renderAt(((now-started)/1000)%18);requestAnimationFrame(tick)}
button.addEventListener('click',async()=>{await motionReady;playing=!playing;button.textContent=playing?'إيقاف':'تشغيل';if(playing){started=performance.now()-clock*1000;requestAnimationFrame(tick)}});
seek.addEventListener('input',async()=>{await motionReady;playing=false;button.textContent='تشغيل';renderAt(Number(seek.value))});
</script></html>
